<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Site</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100&family=Sen:wght@400..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="navbar">
        <div class="navbar-container">
            <div class="logo-container"><h1 class="logo">AdhAld</h1></div>
            <div class="menu-container">
                <ul class="menu-list">
                    <li class="menu-list-item active">Home</li>
                    <li class="menu-list-item">Movies</li>
                    <li class="menu-list-item">Series</li>
                    <li class="menu-list-item">Popular</li>
                    <li class="menu-list-item">Trends</li>
                </ul>
            </div>
            <div class="profile-container">
                <img class="profile-picture" src="img/profile.jpg" alt="">
                <div class="profile-text-container">
                    <span class="profile-text">Username</span>
                    <i class="fas fa-caret-down"></i>
                </div>
                <div class="toggle">
                    <i class="fas fa-moon toggle-icon"></i>
                    <i class="fas fa-sun toggle-icon"></i>
                    <div class="toggle-circle"></div>
                </div>
            </div>
        </div>
    </div>
    <div class="sidebar">
        <i class="fas fa-search sidebar-icon"></i>
        <i class="fas fa-home sidebar-icon"></i>
        <i class="fas fa-users sidebar-icon"></i>
        <i class="fas fa-bookmark sidebar-icon"></i>
        <i class="fas fa-tv sidebar-icon"></i>
        <i class="fas fa-hourglass-start sidebar-icon"></i>
        <i class="fas fa-shopping-cart sidebar-icon"></i>
    </div>
    <div class="container">
        <div class="content-container">
            
        </div>
    </div>
</body>
</html>
